[project]
name = "stars"
version = "0.1.0"
description = "reStructuredText lists from GitHub stars"
readme = {file = "README.rst", content-type = "text/x-rst"}
authors = [
    { name = "iantsysog", email = "264805063+iantsysog@users.noreply.github.com" }
]
requires-python = ">=3.15"
license = "AGPL-3.0-or-later"
license-files = ["COPYING"]
dependencies = [
    "dulwich==1.2.17",
    "githubkit==0.16.1",
    "pydantic==2.14.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[project.scripts]
stars = "stars.main:run"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "ty>=0.0.86",
    "twine>=7.0.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
preview = true
target-version = "py315"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "line-too-long",
    "missing-trailing-comma",
    "missing-copyright-notice",
]

[tool.ty.environment]
python-version = "3.15"
